<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yêu cầu bài hát</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  font-family: Arial, sans-serif;
  min-height: 100vh;

  background:
    linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
    url("./80E39ED9-E68A-40A0-802C-840E92BDC4B1.jpeg")
    center top / cover no-repeat;

  background-attachment: scroll;
}
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
    }
    #message {
  margin-top: 120px;
}
  </style>
</head>

<body>

  <div class="container">

    <h1>🎵 Yêu cầu bài hát</h1>

    <label>Tên của bạn là:</label>
    <input
      id="customer_name"
      type="text"
      placeholder="Nhập tên của bạn"
    >

    <label>Bài hát muốn nghe / hát</label>
    <input
      id="song_request"
      type="text"
      placeholder="Nhập tên bài hát"
    >

    <label>Muốn gửi đến:</label>
    <input
      id="send_to"
      type="text"
      placeholder="Nhập tên người muốn gửi"
    >

    <label>Với lời nhắn:</label>
    <textarea
      id="message_text"
      placeholder="Nhập lời nhắn..."
    ></textarea>

    <button id="submitBtn" onclick="sendRequest()">
      🎵 Gửi yêu cầu
    </button>
    <button type="button" onclick="showPriorityConfirm()">
  🔥 Ưu tiên lên trước
</button>

    <div id="message"></div>

  </div>

  <script>

    const SUPABASE_URL = "https://ehvaahtsqxoscusanksj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WmtNVF8-FRnB60urP86nBA_O7qnbKyt";

    async function sendRequest() {

      const customerName =
        document.getElementById("customer_name").value.trim();

      const songRequest =
        document.getElementById("song_request").value.trim();

      const sendTo =
        document.getElementById("send_to").value.trim();

      const messageText =
        document.getElementById("message_text").value.trim();

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("submitBtn");

      if (!customerName) {
        message.textContent = "⚠️ Bạn hãy nhập tên.";
        return;
      }

      if (!songRequest) {
        message.textContent = "⚠️ Bạn hãy nhập tên bài hát.";
        return;
      }

      button.disabled = true;
      message.textContent = "Đang gửi...";

      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/requests`,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },

            body: JSON.stringify({
              customer_name: customerName,
              song_request: songRequest,
              send_to: sendTo,
              message: messageText
            })
          }
        );

        
        if (!response.ok) {
  const errorText = await response.text();

  message.textContent = "❌ " + errorText;

  console.log("Supabase error:", errorText);

  button.disabled = false;
  return;
}

        window.location.replace("thankyou.html");

        document.getElementById("customer_name").value = "";
        document.getElementById("song_request").value = "";
        document.getElementById("send_to").value = "";
        document.getElementById("message_text").value = "";

      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ Không gửi được yêu cầu. Vui lòng thử lại.";

      } finally {

        button.disabled = false;

      }
    }

  </script>

</body>
</html>
